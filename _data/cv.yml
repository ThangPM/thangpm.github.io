- title: Work Experience
  type: time_table
  contents:
    - title: Senior Machine Learning Engineer at <a href="https://www.adobe.com/" target="_blank">Adobe</a>
      department: Document Cloud Artificial Intelligence (DCAI)
      year: 03/2025 - present
      description:
        - Work on retrieval, context selection, and harness-supported tool use for document intelligence and agent systems.
        - Evaluate evidence-backed answers through controlled comparisons of quality, responsiveness, and resource use.
        - Trace failures across the system, carrying issues through diagnosis, implementation, and verification.
        - Build for shared ownership through self-service workflows, knowledge sharing, and correctness-focused code review.

    - title: Research Scientist Intern at <a href="https://research.adobe.com/" target="_blank">Adobe Research</a>
      year: 2024
      description:
        - Researched efficient small language models for on-device document assistance, published as <a href="https://aclanthology.org/2025.acl-demo.42/">SlimLM at ACL 2025 (System Demonstrations)</a>.
        - Evaluated trade-offs among model size, context length, and on-device inference time.
        - Studied document summarization, question answering, and question suggestion on mobile devices.
        - Developed an Android demonstration for on-device document assistance.

    - title: Research Scientist Intern at <a href="https://research.adobe.com/" target="_blank">Adobe Research</a>
      year: 09/2023 - 01/2024
      description:
        - Researched language-model planning and tool use for image-editing tasks.
        - Constructed instruction-following and preference data for evaluating model behavior.
        - Fine-tuned and evaluated language models for generating and executing tool-use plans.

    - title: Research Scientist Intern at <a href="https://research.adobe.com/" target="_blank">Adobe Research</a>
      year: 05/2021 - 11/2021
      description:
        - Researched contextual phrase representations and semantic search.
        - Developed dataset and benchmark methods for phrase understanding, published as <a href="https://aclanthology.org/2023.eacl-main.1/">PiC at EACL 2023</a>.
        - Fine-tuned and evaluated language models on phrase understanding in context.

    - title: ML/AI Research Engineer at <a href="https://www.aist.go.jp/index_en.html" target="_blank">AIST Japan</a>
      year: 05/2017 - 08/2019
      description:
        - Investigated state-of-the-art deep learning models for named entity recognition (NER), relation and event extraction in biomedical domain.
        - Implemented novel deep neural networks for NER task with <a href="https://www.linkedin.com/in/mohammad-golam-sohrab-ph-d-04566668?originalSubdomain=jp" target="_blank">Dr. Sohrab</a> (EMNLP 2018) and <a href="https://www.linkedin.com/in/meizhi-ju-53b13b108/?originalSubdomain=uk" target="_blank">Dr. Ju</a> (NAACL 2018).
        - Developed the DeepEventMine system with <a href="https://www.linkedin.com/in/long-trieu/?originalSubdomain=vn" target="_blank">Dr. Trieu</a> in the first phase of the project.
        - Fine-tuned hyper-parameters with greedy search and Bayesian optimization methods.
        - Pre-processed biomedical corpora (JNLPBA2004, GENIA, ACE2005, CG2013, MLEE, PHAEDRA).
        - Optimized parallel computing with multiple GPUs for speeding up a model training process.
        - Collaborated with <a href="https://cbrc3.cbrc.pj.aist.go.jp/~nagano/" target="_blank">Dr. Nagano</a> to create the EzCat database.
        - Developed pipelines to evaluate <a href="https://www.nactem.ac.uk/EventMine/" target="_blank">EventMine systems</a> for <a href="https://www.nactem.ac.uk/index.php" target="_blank">NaCTeM (University of Manchester)</a>.

